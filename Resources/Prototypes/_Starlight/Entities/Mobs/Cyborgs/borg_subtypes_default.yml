# Per-borgType "default" subtypes.
#
# These are auto-selected when no subtype is chosen (see BorgTypePrototype.DefaultSubtype),
# so the bare chassis appearance flows through the subtype emission/color render path
# instead of the borgType's legacy two-state eye handling.
#
# They currently reproduce the stock chassis eye (borg_e / borg_e_r, no tint). Convert to
# the emission + four mind colors per borgs.md, same as any other subtype.

- type: entity
  parent: BorgGenericSubtypeBase
  id: BorgGenericSubtypeDefault
  name: Default
  components:
    - type: BorgSubtypeDefinition
      spritePath: Mobs/Silicon/Chassis/generic.rsi
      inventoryTemplateId: borg
      spriteLocalMindState: borg_e
      spriteNoMindState: borg_e_r
      spriteShuntMindState: borg_e
      spriteRemoteControlState: borg_e

